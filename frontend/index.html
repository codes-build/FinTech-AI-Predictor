<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omie's Quantum AI Trading</title>

    <meta name="description" content="Quantum AI - Live Cryptocurrency Price Predictor by Omie. Get real-time AI predictions for BTC, SOL, DOGE and the entire crypto market.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        body { background-color: #030712; color: white; }
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.1) 1px, transparent 1px);
        }
        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(0,0,0,0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0; 
        }
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: rgba(3, 7, 18, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        .ticker {
            display: flex;
            white-space: nowrap;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="font-sans overflow-x-hidden min-h-screen relative pt-14">

    <!-- LIVE MARKET TICKER -->
    <div class="ticker-wrap h-10 flex items-center">
        <div class="ticker text-xs font-mono font-bold tracking-widest text-gray-300" id="liveTicker">
            Loading Live Market Data from Binance...
        </div>
    </div>

    <!-- BACKGROUNDS -->
    <div class="fixed inset-0 bg-grid z-0"></div>
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_rgba(0,0,0,0.2)_0%,_rgba(3,7,18,0.9)_100%)] z-0"></div>
    <div class="glow-orb"></div> 

    <!-- MAIN DASHBOARD -->
    <div class="relative z-10 p-4 lg:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- LEFT PANEL: TradingView Chart Area -->
        <div class="flex-grow bg-black/40 backdrop-blur-md rounded-2xl border border-white/10 flex flex-col shadow-2xl overflow-hidden min-h-[500px]">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/40">
                <div class="flex items-center gap-3">
                    <span class="text-cyan-400 font-bold tracking-widest uppercase" id="chartTitle">MARKET CHART</span>
                    <span id="liveBadge" class="text-xs bg-cyan-500/20 text-cyan-300 px-2 py-1 rounded border border-cyan-500/30 transition-all duration-150">BINANCE LIVE</span>
                </div>
                
                <!-- TIMEFRAME FILTERS -->
                <div class="text-xs flex gap-4 font-bold tracking-widest" id="timeframeSelector">
                    <span class="cursor-pointer text-gray-400 hover:text-white transition" onclick="changeTimeframe('1D', this)">1D</span>
                    <span class="cursor-pointer text-gray-400 hover:text-white transition" onclick="changeTimeframe('1W', this)">1W</span>
                    <span class="cursor-pointer text-cyan-400 transition" onclick="changeTimeframe('1M', this)">1M</span>
                    <span class="cursor-pointer text-gray-400 hover:text-white transition" onclick="changeTimeframe('1Y', this)">1Y</span>
                </div>
            </div>
            
            <div id="tvchart" class="flex-grow relative w-full h-[450px]">
                <div id="chartPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-10 bg-[#030712]/80 backdrop-blur-sm">
                    <div class="w-12 h-12 border-4 border-gray-700 border-t-cyan-500 rounded-full animate-spin mb-4"></div>
                    <p class="tracking-widest text-sm uppercase" id="chartLoadingText">Enter Ticker to Load Chart...</p>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: AI Predictor -->
        <div class="w-full lg:w-[400px] flex flex-col gap-6">
            
            <div class="bg-black/40 backdrop-blur-md p-6 rounded-3xl border border-white/20 shadow-2xl relative overflow-hidden">
                <div id="loadingOverlay" class="absolute inset-0 bg-[#030712]/90 flex flex-col items-center justify-center z-20 hidden backdrop-blur-md">
                    <div class="w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span class="text-cyan-400 font-semibold text-xs tracking-widest animate-pulse">ANALYZING...</span>
                </div>

                <div class="flex items-center mb-6">
                    <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse mr-3 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
                    <h1 class="text-sm font-bold tracking-widest text-white uppercase">Quantum AI Engine</h1>
                </div>

                <input type="text" id="coinSelector" value="BTC" placeholder="ENTER TICKER" 
                    class="w-full bg-black/60 text-cyan-300 font-bold p-4 rounded-xl focus:outline-none border border-white/20 focus:border-cyan-400 text-center mb-4 uppercase tracking-widest">

                <!-- STACKED LAYOUT -->
                <div class="bg-black/30 border border-white/10 rounded-xl p-5 mb-4 flex flex-col gap-4">
                    
                    <!-- Live Price Row -->
                    <div class="flex justify-between items-center border-b border-white/5 pb-3">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Live Market Price</span>
                            <span class="text-3xl text-white font-mono font-bold transition-all duration-300" id="currentPrice">--</span>
                        </div>
                        
                        <!-- Connection Status Dot -->
                        <div class="flex flex-col items-end justify-center">
                            <span class="text-[9px] text-gray-500 uppercase tracking-widest mb-1" id="wsStatusText">WAITING</span>
                            <div id="wsPulse" class="w-2.5 h-2.5 rounded-full bg-gray-600 transition-all duration-150"></div>
                        </div>
                    </div>

                    <!-- AI Target Row -->
                    <div class="flex justify-between items-center">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-cyan-400 uppercase tracking-widest mb-1">AI 24H Target</span>
                            <span class="text-2xl font-bold text-green-400 font-mono" id="predictedPrice">--</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white/5 border border-white/10 rounded-xl p-4 mb-6">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2">
                        <span>AI Signal</span>
                        <span id="aiSignalText" class="font-bold">WAITING...</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-1">
                        <span>Confidence</span>
                        <span id="aiConfidenceText">--%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-1.5 mb-2">
                        <div id="aiConfidenceBar" class="bg-cyan-500 h-1.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>

                <button onclick="getPrediction()" 
                    class="w-full bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-100 font-bold py-4 rounded-xl border border-cyan-400/50 tracking-widest uppercase text-xs transition-all">
                    Generate Setup
                </button>
            </div>
            
            <!-- Paper Trading Terminal -->
            <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-white/10 shadow-2xl">
                <h2 class="text-xs text-gray-400 tracking-widest uppercase mb-4 text-center">Paper Trading Terminal</h2>
                <div class="flex gap-4">
                    <button onclick="alert('Demo: Buy Order Placed via Quantum AI')" class="flex-1 bg-green-500/20 hover:bg-green-500/40 text-green-400 border border-green-500/50 py-3 rounded-xl font-bold tracking-widest uppercase text-sm transition-all shadow-[0_0_15px_rgba(74,222,128,0.2)]">
                        BUY
                    </button>
                    <button onclick="alert('Demo: Sell Order Placed via Quantum AI')" class="flex-1 bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/50 py-3 rounded-xl font-bold tracking-widest uppercase text-sm transition-all shadow-[0_0_15px_rgba(248,113,113,0.2)]">
                        SELL
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const formatCurrency = (num) => {
            return '$' + parseFloat(num).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        };

        // --- TICKER ---
        async function fetchLiveTicker() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","BNBUSDT"]');
                const data = await response.json();
                let tickerHtml = '';
                data.forEach(coin => {
                    const symbol = coin.symbol.replace('USDT', '');
                    const price = parseFloat(coin.lastPrice).toFixed(4);
                    const change = parseFloat(coin.priceChangePercent);
                    const colorClass = change >= 0 ? 'text-green-400' : 'text-red-400';
                    const sign = change >= 0 ? '+' : '';
                    tickerHtml += `<span class="mx-6"><span class="text-white">${symbol}</span> <span class="text-gray-400">$${price}</span> <span class="${colorClass}">${sign}${change.toFixed(2)}%</span></span> | `;
                });
                document.getElementById('liveTicker').innerHTML = tickerHtml + tickerHtml;
            } catch (error) { console.error(error); }
        }
        fetchLiveTicker();
        setInterval(fetchLiveTicker, 10000);

        // --- CHART & WEBSOCKET LOGIC ---
        let chart = null;
        let candlestickSeries = null;
        let binanceSocket = null;
        
        let currentInterval = '4h'; 
        let currentLimit = 180;
        let currentActiveCoin = ''; 
        let lastLivePrice = 0;

        function initChart() {
            if (chart !== null) return; 

            const chartContainer = document.getElementById('tvchart');
            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 450,
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#9ca3af' },
                grid: { vertLines: { color: 'rgba(255, 255, 255, 0.05)' }, horzLines: { color: 'rgba(255, 255, 255, 0.05)' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#4ade80', downColor: '#f87171', borderVisible: false, wickUpColor: '#4ade80', wickDownColor: '#f87171'
            });

            window.addEventListener('resize', () => { if(chart) chart.resize(chartContainer.clientWidth, 450); });
        }

        function changeTimeframe(tf, element) {
            const buttons = document.querySelectorAll('#timeframeSelector span');
            buttons.forEach(btn => {
                btn.classList.remove('text-cyan-400');
                btn.classList.add('text-gray-400');
            });
            element.classList.remove('text-gray-400');
            element.classList.add('text-cyan-400');

            if (tf === '1D') { currentInterval = '1m'; currentLimit = 500; } 
            else if (tf === '1W') { currentInterval = '1h'; currentLimit = 168; } 
            else if (tf === '1M') { currentInterval = '4h'; currentLimit = 180; } 
            else if (tf === '1Y') { currentInterval = '1d'; currentLimit = 365; } 

            if (currentActiveCoin !== '') {
                loadChartData(currentActiveCoin); 
            }
        }

        async function loadChartData(coinSymbol) {
            try {
                initChart(); 
                currentActiveCoin = coinSymbol; 

                const symbol = (coinSymbol === 'btc' ? 'BTC' : coinSymbol.toUpperCase()) + 'USDT';
                
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentInterval}&limit=${currentLimit}`);
                if (!response.ok) throw new Error("Chart Data Not Found");
                
                const data = await response.json();
                const chartData = data.map(d => ({
                    time: d[0] / 1000, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
                }));
                
                candlestickSeries.setData(chartData);
                const placeholder = document.getElementById('chartPlaceholder');
                if(placeholder) placeholder.style.display = 'none';

                // 🔥 THE FIX: STANDARD PORT 443 TO AVOID ISP BLOCKS 🔥
                if(binanceSocket) {
                    binanceSocket.close();
                    document.getElementById('wsStatusText').innerText = "WAITING";
                    document.getElementById('wsPulse').className = "w-2.5 h-2.5 rounded-full bg-gray-600 transition-all duration-150";
                }

                // Removed :9443 from the URL 
                const wsUrl = `wss://stream.binance.com/ws/${symbol.toLowerCase()}@kline_${currentInterval}`;
                binanceSocket = new WebSocket(wsUrl);
                
                binanceSocket.onopen = function() {
                    document.getElementById('wsStatusText').innerText = "CONNECTED";
                    document.getElementById('wsStatusText').className = "text-[9px] text-green-500 uppercase tracking-widest mb-1";
                    document.getElementById('wsPulse').className = "w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_#22c55e]";
                };

                binanceSocket.onerror = function(error) {
                    console.error("WebSocket Blocked:", error);
                    document.getElementById('wsStatusText').innerText = "BLOCKED BY NETWORK";
                    document.getElementById('wsStatusText').className = "text-[9px] text-red-500 uppercase tracking-widest mb-1";
                    document.getElementById('wsPulse').className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
                };

                binanceSocket.onmessage = function (event) {
                    const message = JSON.parse(event.data);
                    const kline = message.k;
                    const livePrice = parseFloat(kline.c);
                    
                    candlestickSeries.update({
                        time: kline.t / 1000,
                        open: parseFloat(kline.o),
                        high: parseFloat(kline.h),
                        low: parseFloat(kline.l),
                        close: livePrice
                    });

                    const priceText = document.getElementById('currentPrice');
                    priceText.innerText = formatCurrency(livePrice);

                    if (lastLivePrice !== 0 && livePrice !== lastLivePrice) {
                        if (livePrice > lastLivePrice) {
                            priceText.style.color = '#4ade80';
                            priceText.style.textShadow = '0 0 15px rgba(74, 222, 128, 0.8)';
                        } else if (livePrice < lastLivePrice) {
                            priceText.style.color = '#f87171';
                            priceText.style.textShadow = '0 0 15px rgba(248, 113, 113, 0.8)';
                        }
                        setTimeout(() => {
                            priceText.style.color = '#ffffff';
                            priceText.style.textShadow = 'none';
                        }, 600); 
                    }
                    
                    lastLivePrice = livePrice;
                }
            } catch (error) { console.error(error); }
        }

        // --- AI PREDICTION LOGIC ---
        async function getPrediction() {
            const coinInput = document.getElementById('coinSelector').value.trim().toLowerCase();
            if(!coinInput) return;
            
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('chartTitle').innerText = coinInput.toUpperCase() + '/USD';

            try {
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coinInput}`);
                const data = await response.json();

                if(!data.error) {
                    const actualCoin = data.coin || coinInput;
                    
                    lastLivePrice = parseFloat(data.last_close_price);

                    document.getElementById('currentPrice').innerText = formatCurrency(data.last_close_price);
                    document.getElementById('predictedPrice').innerText = formatCurrency(data.predicted_price);
                    
                    const signalElement = document.getElementById('aiSignalText');
                    const tradeSignal = data.trade_signal || "PROCESSING";
                    
                    signalElement.innerText = tradeSignal;
                    if(tradeSignal.includes('BUY')) signalElement.className = 'text-green-400 font-extrabold tracking-widest';
                    else if(tradeSignal.includes('SELL')) signalElement.className = 'text-red-400 font-extrabold tracking-widest';
                    else signalElement.className = 'text-yellow-400 font-extrabold tracking-widest';

                    const conf = data.confidence_score || 0;
                    document.getElementById('aiConfidenceText').innerText = conf + '%';
                    document.getElementById('aiConfidenceBar').style.width = conf + '%';

                    loadChartData(actualCoin);
                }
            } catch (error) {
                console.log(error);
                document.getElementById('aiSignalText').innerText = 'SYS_ERROR';
                document.getElementById('aiSignalText').className = 'text-red-500 font-bold';
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
