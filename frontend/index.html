<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omie's Quantum AI Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Moving High-Tech Market Grid Background - BRIGHTER */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(59, 130, 246, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.25) 1px, transparent 1px);
            animation: panGrid 20s linear infinite;
        }
        @keyframes panGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: 40px 40px; }
        }
        
        /* The Secret Sauce for Glassmorphism: A glowing orb behind the card */
        .glow-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59,130,246,0.6) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; /* Piche rahega */
            border-radius: 50%;
            animation: pulseOrb 4s ease-in-out infinite alternate;
        }
        @keyframes pulseOrb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* Smooth Fade out for Splash Screen */
        .fade-out {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        /* Neon Glow Text */
        .neon-text {
            text-shadow: 0 0 10px rgba(59,130,246,0.8), 0 0 20px rgba(59,130,246,0.5);
        }
        
        /* Floating Animation for Card */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans overflow-hidden min-h-screen relative">

    <!-- 1. CINEMATIC SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gray-950">
        <h1 class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-green-400 tracking-[0.2em] animate-pulse neon-text">
            QUANTUM AI
        </h1>
        <p class="text-blue-400 mt-4 tracking-widest text-sm uppercase">Initializing Market Neural Net...</p>
    </div>

    <!-- 2. MOVING BACKGROUND & GLOW ORB -->
    <div class="absolute inset-0 bg-grid z-0 opacity-80"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-gray-950/80 to-gray-950 z-0"></div>
    <div class="glow-orb"></div> <!-- Yeh orb glass effect ko zinda karega -->

    <!-- 3. MAIN DASHBOARD (TRUE GLASSMORPHISM) -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        <!-- bg-white/[0.05] aur backdrop-blur-2xl ekdum premium sheesha banayega -->
        <div class="max-w-md w-full bg-white/[0.05] backdrop-blur-2xl p-8 rounded-3xl border border-white/10 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] floating-card">
            
            <div class="flex items-center justify-center mb-2">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse mr-2"></div>
                <h1 class="text-xl font-bold tracking-widest text-gray-100 uppercase">Market Analytics</h1>
            </div>
            <p class="text-center text-gray-400 mb-8 text-xs tracking-wider">PREDICTIVE AI ENGINE V2</p>

            <!-- Search Bar -->
            <div class="mb-6 relative">
                <input type="text" id="coinSelector" value="SOL" placeholder="ENTER TICKER" 
                    class="w-full bg-black/40 text-blue-400 font-bold p-4 rounded-xl focus:outline-none border border-white/10 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 uppercase tracking-widest text-center shadow-inner placeholder-gray-500 transition-all backdrop-blur-md">
            </div>

            <!-- Premium Data Card -->
            <div class="bg-black/30 border border-white/5 rounded-xl p-6 mb-6 relative overflow-hidden min-h-[120px] backdrop-blur-md">
                
                <!-- Loading Animation -->
                <div id="loadingOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-10 hidden backdrop-blur-sm">
                    <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span class="text-blue-400 font-semibold text-sm tracking-widest animate-pulse">PROCESSING...</span>
                </div>
                
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-400 text-[10px] uppercase tracking-widest mb-1" id="currentDateLabel">LAST CLOSE</p>
                        <p class="text-2xl font-light text-gray-100" id="currentPrice">--</p>
                    </div>
                    <div class="text-right">
                        <p class="text-blue-400 text-[10px] uppercase tracking-widest mb-1 font-bold" id="targetDateLabel">AI TARGET</p>
                        <p class="text-3xl font-bold text-green-400 neon-text" id="predictedPrice">--</p>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="getPrediction()" 
                class="w-full bg-gradient-to-r from-blue-600/80 to-blue-800/80 hover:from-blue-500 hover:to-blue-700 text-white font-bold py-4 px-4 rounded-xl transition-all duration-300 shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] tracking-widest uppercase text-sm border border-blue-500/50 backdrop-blur-sm">
                Initialize Prediction
            </button>
            <p id="errorMsg" class="text-red-400 text-xs mt-4 text-center hidden font-mono"></p>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 1000);
            }, 2500); 
        });

        async function getPrediction() {
            const coin = document.getElementById('coinSelector').value.trim().toLowerCase();
            const loading = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('errorMsg');
            
            if(!coin) {
                errorMsg.innerText = "[ERROR] EMPTY TICKER SYMBOL";
                errorMsg.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coin}`);
                const data = await response.json();

                if(data.error) throw new Error(data.error);

                document.getElementById('currentPrice').innerText = '$' + data.last_close_price;
                document.getElementById('predictedPrice').innerText = '$' + data.predicted_price;
                
                document.getElementById('currentDateLabel').innerText = `CLOSE [${data.current_date}]`;
                document.getElementById('targetDateLabel').innerText = `TARGET [${data.target_date}]`;

            } catch (error) {
                errorMsg.innerText = "[SYS_ERROR] CONNECTION FAILED. TRY AGAIN.";
                errorMsg.classList.remove('hidden');
                
                document.getElementById('currentPrice').innerText = '--';
                document.getElementById('predictedPrice').innerText = '--';
                document.getElementById('currentDateLabel').innerText = 'LAST CLOSE';
                document.getElementById('targetDateLabel').innerText = 'AI TARGET';
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
