<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FinTech Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-1">AI Market Analytics</h1>
        <p class="text-center text-gray-400 mb-6 text-sm">Universal Crypto AI Predictor</p>

        <!-- Search Bar -->
        <div class="mb-6">
            <label class="block text-gray-400 text-sm mb-2">Enter Crypto Symbol (e.g., BTC, SOL, DOGE, SHIB)</label>
            <input type="text" id="coinSelector" value="SOL" placeholder="Type symbol..." class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase">
        </div>

        <!-- Premium Data Card -->
        <div class="bg-gray-700 rounded-lg p-5 mb-6 relative overflow-hidden min-h-[100px]">
            <!-- Loading Animation Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-gray-700/90 flex flex-col items-center justify-center rounded-lg z-10 hidden backdrop-blur-sm">
                <span class="text-blue-400 font-semibold animate-pulse">Training AI Model...</span>
                <span class="text-xs text-gray-400 mt-1">Fetching live market data</span>
            </div>
            
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-xs" id="currentDateLabel">Last Close Price</p>
                    <p class="text-2xl font-bold" id="currentPrice">--</p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 text-xs" id="targetDateLabel">AI Prediction (Next Day)</p>
                    <p class="text-3xl font-bold text-green-400" id="predictedPrice">--</p>
                </div>
            </div>
        </div>

        <button onclick="getPrediction()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Generate AI Prediction
        </button>
        <p id="errorMsg" class="text-red-400 text-sm mt-4 text-center hidden"></p>
    </div>

    <script>
        async function getPrediction() {
            // Text box se value uthana (spaces hata kar)
            const coin = document.getElementById('coinSelector').value.trim().toLowerCase();
            const loading = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('errorMsg');
            
            if(!coin) {
                errorMsg.innerText = "Please enter a coin symbol!";
                errorMsg.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coin}`);
                const data = await response.json();

                if(data.error) throw new Error(data.error);

                document.getElementById('currentPrice').innerText = '$' + data.last_close_price;
                document.getElementById('predictedPrice').innerText = '$' + data.predicted_price;
                
                document.getElementById('currentDateLabel').innerText = `Close (${data.current_date})`;
                document.getElementById('targetDateLabel').innerText = `Prediction (${data.target_date})`;

            } catch (error) {
                errorMsg.innerText = error.message || "Backend is starting up (takes ~30 secs) or invalid coin symbol. Try again!";
                errorMsg.classList.remove('hidden');
                
                // Agar error aaye toh -- dikhao
                document.getElementById('currentPrice').innerText = '--';
                document.getElementById('predictedPrice').innerText = '--';
                document.getElementById('currentDateLabel').innerText = 'Last Close Price';
                document.getElementById('targetDateLabel').innerText = 'AI Prediction';
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
