<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crypto Predictor | Omie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-3xl w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-3xl font-bold mb-2 text-blue-400">AI Market Analytics</h1>
        <p class="text-gray-400 mb-6">Solana (SOL-USD) Price Predictor</p>
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 bg-gray-700 p-4 rounded-lg gap-4">
            <div class="text-center sm:text-left">
                <p class="text-sm text-gray-400">Last Close Price</p>
                <p class="text-3xl font-bold" id="current-price">Loading...</p>
            </div>
            <div class="text-center sm:text-right">
                <p class="text-sm text-gray-400">AI Prediction (Next Day)</p>
                <p class="text-3xl font-bold text-green-400" id="predicted-price">Computing...</p>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div class="w-full bg-gray-900 p-4 rounded-lg mb-6">
            <canvas id="priceChart" height="100"></canvas>
        </div>

        <button onclick="getPrediction()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300">
            Refresh AI Data
        </button>
        <p class="text-xs text-red-400 mt-4 hidden" id="error-message">Cannot connect to AI Server. Is Flask running?</p>
    </div>

    <script>
        let myChart = null; // Store chart instance

        async function getPrediction() {
            try {
                document.getElementById('error-message').classList.add('hidden');
                
                const response = await fetch('https://omie-fintech-api.onrender.com/predict/solana');
                const data = await response.json();
                
                document.getElementById('current-price').innerText = "$" + data.last_close_price;
                document.getElementById('predicted-price').innerText = "$" + data.predicted_next_day_price;

                drawChart(data.history_dates, data.history_prices, data.predicted_next_day_price);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        function drawChart(dates, prices, prediction) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            // Clean dates for the X-axis (e.g., '2026-09-01' -> 'Sep 01')
            const shortDates = dates.map(date => {
                const d = new Date(date);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            });
            
            // Add an extra 'Tomorrow' label for the AI prediction
            shortDates.push('Tomorrow (AI)');
            
            // Add the prediction to the price array
            const chartPrices = [...prices, prediction];

            // Make the last line segment (prediction) a different color using an array of colors
            const pointColors = prices.map(() => '#3b82f6'); // Blue for history
            pointColors.push('#4ade80'); // Green for prediction

            if (myChart) myChart.destroy(); // Destroy old chart before redrawing

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: shortDates,
                    datasets: [{
                        label: 'Solana Price ($)',
                        data: chartPrices,
                        borderColor: '#3b82f6',
                        borderWidth: 2,
                        pointBackgroundColor: pointColors,
                        pointRadius: 4,
                        fill: true,
                        backgroundColor: 'rgba(59, 130, 246, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                        x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        getPrediction();
    </script>
</body>
</html>
