<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omie's Quantum AI Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Extreme High-Tech Market Grid */
        body { background-color: #030712; } /* Very deep blue-black */
        
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.3) 1px, transparent 1px);
            animation: panGrid 20s linear infinite;
        }
        @keyframes panGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: 50px 50px; }
        }
        
        /* Brighter, Larger Neon Cyan Orb */
        .glow-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(0,0,0,0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; 
            border-radius: 50%;
            animation: pulseOrb 4s ease-in-out infinite alternate;
        }
        @keyframes pulseOrb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(56,189,248,0.8), 0 0 20px rgba(56,189,248,0.5);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-white font-sans overflow-hidden min-h-screen relative">

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#030712]">
        <h1 class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 tracking-[0.2em] animate-pulse neon-text">
            QUANTUM AI
        </h1>
        <p class="text-cyan-400 mt-4 tracking-widest text-sm uppercase">Initializing Market Neural Net...</p>
    </div>

    <!-- 2. BRIGHT MOVING GRID & ORB -->
    <div class="absolute inset-0 bg-grid z-0 opacity-100"></div>
    <!-- Lighter vignette so center stays bright -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(0,0,0,0.1)_0%,_rgba(3,7,18,0.9)_100%)] z-0"></div>
    <div class="glow-orb"></div> 

    <!-- 3. TRUE GLASSMORPHISM DASHBOARD -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        
        <!-- bg-white/10 and border-white/20 creates the actual frosted glass look -->
        <div class="max-w-md w-full bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)] floating-card">
            
            <div class="flex items-center justify-center mb-2">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse mr-2 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
                <h1 class="text-xl font-bold tracking-widest text-white uppercase">Market Analytics</h1>
            </div>
            <p class="text-center text-cyan-200 mb-8 text-xs tracking-wider">PREDICTIVE AI ENGINE V2</p>

            <!-- Search Bar (Glassy) -->
            <div class="mb-6 relative">
                <input type="text" id="coinSelector" value="SOL" placeholder="ENTER TICKER" 
                    class="w-full bg-white/5 text-cyan-300 font-bold p-4 rounded-xl focus:outline-none border border-white/20 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 uppercase tracking-widest text-center shadow-inner placeholder-gray-400 transition-all backdrop-blur-sm">
            </div>

            <!-- Premium Data Card (Glassy) -->
            <div class="bg-white/5 border border-white/10 rounded-xl p-6 mb-6 relative overflow-hidden min-h-[120px] backdrop-blur-sm shadow-inner">
                
                <div id="loadingOverlay" class="absolute inset-0 bg-[#030712]/80 flex flex-col items-center justify-center z-10 hidden backdrop-blur-md">
                    <div class="w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span class="text-cyan-400 font-semibold text-sm tracking-widest animate-pulse">PROCESSING...</span>
                </div>
                
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-300 text-[10px] uppercase tracking-widest mb-1" id="currentDateLabel">LAST CLOSE</p>
                        <p class="text-2xl font-light text-white" id="currentPrice">--</p>
                    </div>
                    <div class="text-right">
                        <p class="text-cyan-400 text-[10px] uppercase tracking-widest mb-1 font-bold" id="targetDateLabel">AI TARGET</p>
                        <p class="text-3xl font-bold text-green-400 neon-text" id="predictedPrice">--</p>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="getPrediction()" 
                class="w-full bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-100 font-bold py-4 px-4 rounded-xl transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] tracking-widest uppercase text-sm border border-cyan-400/50 backdrop-blur-md">
                Initialize Prediction
            </button>
            <p id="errorMsg" class="text-red-400 text-xs mt-4 text-center hidden font-mono"></p>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 1000);
            }, 2500); 
        });

        async function getPrediction() {
            const coin = document.getElementById('coinSelector').value.trim().toLowerCase();
            const loading = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('errorMsg');
            
            if(!coin) {
                errorMsg.innerText = "[ERROR] EMPTY TICKER SYMBOL";
                errorMsg.classList.remove('hidden');
                return;
            }

            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coin}`);
                const data = await response.json();

                if(data.error) throw new Error(data.error);

                document.getElementById('currentPrice').innerText = '$' + data.last_close_price;
                document.getElementById('predictedPrice').innerText = '$' + data.predicted_price;
                
                document.getElementById('currentDateLabel').innerText = `CLOSE [${data.current_date}]`;
                document.getElementById('targetDateLabel').innerText = `TARGET [${data.target_date}]`;

            } catch (error) {
                errorMsg.innerText = "[SYS_ERROR] CONNECTION FAILED. TRY AGAIN.";
                errorMsg.classList.remove('hidden');
                
                document.getElementById('currentPrice').innerText = '--';
                document.getElementById('predictedPrice').innerText = '--';
                document.getElementById('currentDateLabel').innerText = 'LAST CLOSE';
                document.getElementById('targetDateLabel').innerText = 'AI TARGET';
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
