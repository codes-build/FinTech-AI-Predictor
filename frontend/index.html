<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omie's Quantum AI Trading</title>

    <meta name="description" content="Quantum AI - Live Cryptocurrency Price Predictor by Omie. Get real-time AI predictions for BTC, SOL, DOGE and the entire crypto market.">
    <meta name="keywords" content="Crypto Predictor, AI Market Analytics, Machine Learning Trading, Solana, Bitcoin, Dogecoin, Quantum AI">
    <meta name="author" content="Omie">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: white; }
        
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(56, 189, 248, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.15) 1px, transparent 1px);
            animation: panGrid 20s linear infinite;
        }
        @keyframes panGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: 50px 50px; }
        }
        
        .glow-orb {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(0,0,0,0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0; 
            border-radius: 50%;
            animation: pulseOrb 6s ease-in-out infinite alternate;
        }
        @keyframes pulseOrb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        /* Ticker Animation */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: rgba(3, 7, 18, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        .ticker {
            display: flex;
            white-space: nowrap;
            animation: ticker 30s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="font-sans overflow-x-hidden min-h-screen relative pt-10">

    <!-- 1. LIVE MARKET TICKER -->
    <div class="ticker-wrap h-10 flex items-center">
        <div class="ticker text-xs font-mono font-bold tracking-widest text-gray-300" id="liveTicker">
            Loading Live Market Data from Binance...
        </div>
    </div>

    <!-- BACKGROUNDS -->
    <div class="fixed inset-0 bg-grid z-0 opacity-100"></div>
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_rgba(0,0,0,0.1)_0%,_rgba(3,7,18,0.9)_100%)] z-0"></div>
    <div class="glow-orb"></div> 

    <!-- 2. MAIN TRADING DASHBOARD -->
    <div class="relative z-10 p-6 flex flex-col lg:flex-row gap-6 min-h-[90vh]">
        
        <!-- LEFT PANEL: TradingView Chart Area (Placeholder for now) -->
        <div class="flex-grow bg-white/5 backdrop-blur-md rounded-2xl border border-white/10 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-cyan-400 font-bold tracking-widest uppercase" id="chartTitle">BTC/USD</span>
                    <span class="text-xs bg-cyan-500/20 text-cyan-300 px-2 py-1 rounded border border-cyan-500/30">LIVE CHART</span>
                </div>
                <div class="text-xs text-gray-400 flex gap-4">
                    <span>1H</span>
                    <span class="text-cyan-400">1D</span>
                    <span>1W</span>
                </div>
            </div>
            <div class="flex-grow flex items-center justify-center p-8 relative min-h-[400px]">
                <!-- Yahan hum agli step mein TradingView JS Chart embed karenge -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-gray-500">
                    <div class="w-12 h-12 border-4 border-gray-700 border-t-cyan-500 rounded-full animate-spin mb-4"></div>
                    <p class="tracking-widest text-sm uppercase">Initializing TradingView Engine...</p>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: AI Predictor & Paper Trading -->
        <div class="w-full lg:w-[400px] flex flex-col gap-6">
            
            <!-- AI Analytics Card -->
            <div class="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/20 shadow-[0_8px_32px_0_rgba(0,0,0,0.5)]">
                <div class="flex items-center mb-6">
                    <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse mr-3 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
                    <h1 class="text-sm font-bold tracking-widest text-white uppercase">Quantum AI Engine</h1>
                </div>

                <input type="text" id="coinSelector" value="SOL" placeholder="ENTER TICKER" 
                    class="w-full bg-black/40 text-cyan-300 font-bold p-4 rounded-xl focus:outline-none border border-white/20 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 uppercase tracking-widest text-center shadow-inner placeholder-gray-500 transition-all mb-4">

                <div class="bg-black/30 border border-white/10 rounded-xl p-4 mb-4 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-2">
                        <p class="text-gray-400 text-[10px] uppercase tracking-widest">LAST CLOSE</p>
                        <p class="text-cyan-400 text-[10px] uppercase tracking-widest">AI TARGET (24H)</p>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-xl font-light text-white" id="currentPrice">--</p>
                        <p class="text-2xl font-bold text-green-400" id="predictedPrice">--</p>
                    </div>
                </div>

                <!-- NEW: AI Signals & Confidence -->
                <div class="bg-black/30 border border-white/10 rounded-xl p-4 mb-6">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2">
                        <span>AI Signal</span>
                        <span class="text-cyan-400">Strong Buy</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-1">
                        <span>AI Confidence Meter</span>
                        <span>87%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-1.5 mb-2">
                        <div class="bg-gradient-to-r from-cyan-500 to-green-400 h-1.5 rounded-full" style="width: 87%"></div>
                    </div>
                </div>

                <button onclick="getPrediction()" 
                    class="w-full bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-100 font-bold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)] tracking-widest uppercase text-xs border border-cyan-400/50 mb-2">
                    Generate Setup
                </button>
            </div>

            <!-- Paper Trading Buy/Sell Box -->
            <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-white/10">
                <h2 class="text-xs text-gray-400 tracking-widest uppercase mb-4 text-center">Paper Trading Terminal</h2>
                <div class="flex gap-4">
                    <button onclick="alert('Demo: Buy Order Placed via Quantum AI')" class="flex-1 bg-green-500/20 hover:bg-green-500/40 text-green-400 border border-green-500/50 py-3 rounded-xl font-bold tracking-widest uppercase text-sm transition-all shadow-[0_0_15px_rgba(74,222,128,0.2)]">
                        BUY
                    </button>
                    <button onclick="alert('Demo: Sell Order Placed via Quantum AI')" class="flex-1 bg-red-500/20 hover:bg-red-500/40 text-red-400 border border-red-500/50 py-3 rounded-xl font-bold tracking-widest uppercase text-sm transition-all shadow-[0_0_15px_rgba(248,113,113,0.2)]">
                        SELL
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // BINANCE FREE API FOR LIVE TICKER
        async function fetchLiveTicker() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","SOLUSDT","DOGEUSDT","BNBUSDT","XRPUSDT"]');
                const data = await response.json();
                let tickerHtml = '';
                
                data.forEach(coin => {
                    const symbol = coin.symbol.replace('USDT', '');
                    const price = parseFloat(coin.lastPrice).toFixed(4);
                    const change = parseFloat(coin.priceChangePercent);
                    const colorClass = change >= 0 ? 'text-green-400' : 'text-red-400';
                    const sign = change >= 0 ? '+' : '';
                    
                    tickerHtml += `<span class="mx-6">
                        <span class="text-white">${symbol}</span> 
                        <span class="text-gray-400">$${price}</span> 
                        <span class="${colorClass}">${sign}${change.toFixed(2)}%</span>
                    </span> | `;
                });
                
                // Duplicate for smooth infinite scroll
                document.getElementById('liveTicker').innerHTML = tickerHtml + tickerHtml;
            } catch (error) {
                console.error("Ticker Error:", error);
            }
        }
        
        fetchLiveTicker();
        setInterval(fetchLiveTicker, 10000); // Update every 10 seconds for free

        // EXISTING AI PREDICTION LOGIC
        async function getPrediction() {
            const coin = document.getElementById('coinSelector').value.trim().toLowerCase();
            if(!coin) return;
            
            document.getElementById('chartTitle').innerText = coin.toUpperCase() + '/USD';
            document.getElementById('currentPrice').innerText = '...';
            document.getElementById('predictedPrice').innerText = '...';

            try {
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coin}`);
                const data = await response.json();

                if(!data.error) {
                    document.getElementById('currentPrice').innerText = '$' + data.last_close_price;
                    document.getElementById('predictedPrice').innerText = '$' + data.predicted_price;
                }
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>
</html>
