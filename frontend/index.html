<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FinTech Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-1">AI Market Analytics</h1>
        <p class="text-center text-gray-400 mb-6 text-sm">Real-Time Crypto Price Predictor</p>

        <!-- Dropdown Selector -->
        <div class="mb-6">
            <label class="block text-gray-400 text-sm mb-2">Select Cryptocurrency</label>
            <select id="coinSelector" class="w-full bg-gray-700 text-white p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <option value="bitcoin">Bitcoin (BTC)</option>
                <option value="ethereum">Ethereum (ETH)</option>
                <option value="solana" selected>Solana (SOL)</option>
            </select>
        </div>

        <!-- Premium Data Card -->
        <div class="bg-gray-700 rounded-lg p-5 mb-6 relative overflow-hidden">
            <!-- Loading Animation Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-gray-700/90 flex items-center justify-center rounded-lg z-10 hidden backdrop-blur-sm">
                <span class="text-blue-400 font-semibold animate-pulse">Computing AI Model...</span>
            </div>
            
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-gray-400 text-xs" id="currentDateLabel">Last Close Price</p>
                    <p class="text-2xl font-bold" id="currentPrice">--</p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 text-xs" id="targetDateLabel">AI Prediction (Next Day)</p>
                    <p class="text-3xl font-bold text-green-400" id="predictedPrice">--</p>
                </div>
            </div>
        </div>

        <button onclick="getPrediction()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Generate AI Prediction
        </button>
        <p id="errorMsg" class="text-red-400 text-xs mt-4 text-center hidden"></p>
    </div>

    <script>
        async function getPrediction() {
            const coin = document.getElementById('coinSelector').value;
            const loading = document.getElementById('loadingOverlay');
            const errorMsg = document.getElementById('errorMsg');
            
            loading.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            try {
                // Tumhare live backend se data fetch kar raha hai
                const response = await fetch(`https://omie-fintech-api.onrender.com/predict/${coin}`);
                const data = await response.json();

                if(data.error) throw new Error(data.error);

                document.getElementById('currentPrice').innerText = '$' + data.last_close_price;
                document.getElementById('predictedPrice').innerText = '$' + data.predicted_price;
                
                // Real dates screen par update hongi
                document.getElementById('currentDateLabel').innerText = `Close (${data.current_date})`;
                document.getElementById('targetDateLabel').innerText = `Prediction (${data.target_date})`;

            } catch (error) {
                errorMsg.innerText = "Error fetching data from AI engine. Please try again.";
                errorMsg.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Page khulte hi run hoga
        getPrediction();
    </script>
</body>
</html>
